name: Release APK

# Manual only: pick a version tag to build & publish. The signing keystore
# never touches the repo — it's decoded from a base64 GitHub Secret into a
# gitignored file for the duration of the job, then discarded with the
# runner.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.4.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-app/pubspec.yaml
          channel: stable
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode signing keystore
        working-directory: flutter-app/android
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > besserbahn-release.jks

      - name: Write key.properties
        working-directory: flutter-app/android
        run: |
          cat > key.properties <<EOF
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=besserbahn-release.jks
          EOF

      - name: Get dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Build release APKs (split per ABI)
        working-directory: flutter-app
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with tag
        working-directory: flutter-app/build/app/outputs/flutter-apk
        run: |
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            mv "$f" "BesserBahn-${{ github.event.inputs.tag }}-$abi.apk"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: flutter-app/build/app/outputs/flutter-apk/BesserBahn-*.apk
